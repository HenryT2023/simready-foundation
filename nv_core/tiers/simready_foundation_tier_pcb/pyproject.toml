[project]
name = "simready-foundation-tier-pcb"
version = "0.1.0a1"
description = "SimReady Foundation PCB tier: the PCB/PCBA AOI capabilities, features, profiles, and validators for the PCB-to-USD input contract"
authors = [
    {name = "NVIDIA"},
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "usd-validation-nvidia>=1.21.0",
    "simready-foundation-tier-core",
]

[project.entry-points."usd_validation_nvidia"]
simready-validate-tier-pcb = "simready.foundation.tier_pcb:SimReadyPlugin"

[project.entry-points."simready.tier"]
tier_pcb = "simready.foundation.tier_pcb:tier"

[project.urls]
Documentation = "https://nvidia.github.io/simready-foundation/"

[project.optional-dependencies]
usd = ["usd-core>=22.11"]
test = ["pytest"]

[tool.hatch.build.hooks.custom]
path = "../_tooling/build_hook.py"
module = "simready.foundation.tier_pcb"
reverse_domain = "com.nvidia.simready"

[tool.hatch.build.targets.wheel]
packages = ["simready"]

[tool.hatch.build.targets.wheel.force-include]
"_build/python/simready/foundation/tier_pcb/requirements" = "simready/foundation/tier_pcb/requirements"

[build-system]
requires = ["hatchling", "usd-profiles-nvidia"]
build-backend = "hatchling.build"
